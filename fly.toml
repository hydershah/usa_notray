app = 'usa-notray-muddy-sound-7799'
primary_region = 'ord'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  # DISABLE_REDIS = 'true'  # RE-ENABLED: Redis caching for performance

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
