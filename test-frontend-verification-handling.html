<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Frontend Verification Response Handling</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { border: 1px solid #ccc; margin: 20px 0; padding: 15px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .log { background-color: #f8f9fa; padding: 10px; margin: 10px 0; font-family: monospace; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Frontend Verification Response Handler Test</h1>
    
    <div class="test-section info">
        <h3>Test Different Response Types</h3>
        <button onclick="testSuccessResponse()">Test Success Response</button>
        <button onclick="testErrorResponse()">Test Error Response</button>
        <button onclick="testTimeoutResponse()">Test Timeout Response</button>
        <button onclick="testNetworkError()">Test Network Error</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="test-section">
        <h3>Console Output</h3>
        <div id="log" class="log"></div>
    </div>

    <script>
        // Mock console to capture output
        const originalConsole = {
            log: console.log,
            error: console.error
        };

        function logToPage(type, ...args) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>[${timestamp}] ${type.toUpperCase()}:</strong> ${message}`;
            logEntry.style.color = type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'black';
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            // Also log to real console
            originalConsole[type === 'error' ? 'error' : 'log'](...args);
        }

        console.log = (...args) => logToPage('log', ...args);
        console.error = (...args) => logToPage('error', ...args);

        // Mock verification response handler (similar to the one in evs-verification.tsx)
        function handleVerificationResponse(response, result) {
            console.log('📥 HTTP', response.status, 'response received:', result);
            console.log('   result.success:', result.success);
            console.log('   result.status:', result.status);
            console.log('   result.confidence:', result.confidence);
            
            if (response.ok) {
                // Check for both HTTP 200 AND result.success === true
                if (result.success === true || result.status === 'approved') {
                    console.log('✅ Verification completed successfully - updating UI state');
                    console.log('🎉 Success toast displayed and callbacks executed');
                    return 'SUCCESS';
                } else {
                    // HTTP 200 but result.success === false - treat as error
                    console.log('❌ Backend returned HTTP 200 but success=false:', result);
                    console.log('   result.message:', result.message);
                    console.log('   result.reasons:', result.reasons);
                    throw new Error(result.message || result.reasons?.join('; ') || 'Verification failed despite HTTP 200');
                }
            } else {
                console.log(`❌ HTTP Error ${response.status}:`, response.statusText);
                const errorMessage = result.message || 'Verification failed';
                throw new Error(errorMessage);
            }
        }

        function testSuccessResponse() {
            console.log('\n🧪 Testing SUCCESS response...');
            const mockResponse = { ok: true, status: 200, statusText: 'OK' };
            const mockResult = {
                success: true,
                status: 'approved',
                confidence: 100,
                message: 'Identity successfully verified',
                verificationId: 'test_123',
                verifiedAt: new Date().toISOString()
            };
            
            try {
                const result = handleVerificationResponse(mockResponse, mockResult);
                console.log('🎯 Test Result:', result);
            } catch (error) {
                console.error('❌ Unexpected error in success test:', error);
            }
        }

        function testErrorResponse() {
            console.log('\n🧪 Testing ERROR response...');
            const mockResponse = { ok: false, status: 400, statusText: 'Bad Request' };
            const mockResult = {
                success: false,
                status: 'denied',
                confidence: 0,
                message: 'Document images could not be processed',
                reasons: ['Image quality too low', 'Document not clearly visible']
            };
            
            try {
                const result = handleVerificationResponse(mockResponse, mockResult);
                console.log('🎯 Test Result:', result);
            } catch (error) {
                console.log('✅ Expected error caught:', error.message);
            }
        }

        function testTimeoutResponse() {
            console.log('\n🧪 Testing HTTP 200 with success=false (backend issue)...');
            const mockResponse = { ok: true, status: 200, statusText: 'OK' };
            const mockResult = {
                success: false,
                status: 'error',
                confidence: 0,
                message: 'BlueAssure workflow is disabled',
                reasons: ['Account configuration issue'],
                warnings: ['Contact BlueAssure support']
            };
            
            try {
                const result = handleVerificationResponse(mockResponse, mockResult);
                console.log('🎯 Test Result:', result);
            } catch (error) {
                console.log('✅ Expected error caught for HTTP 200 + success=false:', error.message);
            }
        }

        function testNetworkError() {
            console.log('\n🧪 Testing Network Error handling...');
            
            // Simulate network error handling
            try {
                console.log('🚨 Verification error caught: TypeError: Failed to fetch');
                console.log('   Error name: TypeError');
                console.log('   Error message: Failed to fetch');
                
                if ('Failed to fetch'.includes('Failed to fetch')) {
                    console.log('🌐 Network fetch failed');
                    console.log('✅ Network error would trigger auto-retry mechanism');
                }
            } catch (error) {
                console.error('Error in network test:', error);
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Auto-run success test on page load
        window.onload = () => {
            console.log('🚀 Frontend Verification Response Handler Test Loaded');
            console.log('📋 This tests the improved response handling logic');
            console.log('');
        };
    </script>
</body>
</html>
