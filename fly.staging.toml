# fly.toml app configuration file generated for usa-notray-staging on 2025-07-09T06:39:44+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'usa-notray-staging'
primary_region = 'ord'

[experimental]
  auto_rollback = true

[build]

[env]
  NODE_ENV = 'staging'
  PORT = '3000'
  # DISABLE_REDIS = 'true'  # RE-ENABLED: Redis caching for performance

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
