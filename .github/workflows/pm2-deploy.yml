name: Deploy Node.js Backend App via PM2

on:
  push:
    branches: [main, master, staging-9.0]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  APP_NAME: 'usa-notary'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run build:production
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.cjs" ]; then
            echo "❌ Build failed - dist/index.cjs not found"
            ls -la dist/ || echo "dist/ directory not found"
            exit 1
          fi
          echo "✅ Build verification successful"
          ls -la dist/
          
          # Verify ecosystem.config.js is valid
          if ! node -e "
            try {
              const config = await import('./ecosystem.config.js');
              console.log('✅ ecosystem.config.js is valid ES module');
            } catch (error) {
              console.error('❌ ecosystem.config.js error:', error.message);
              process.exit(1);
            }
          "; then
            echo "❌ ecosystem.config.js validation failed"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"

      - name: Create release directory
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "RELEASE_DIR=/opt/usa_notray/releases/$TIMESTAMP" >> $GITHUB_ENV
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/usa_notray/releases/$TIMESTAMP"

      - name: Upload application files
        run: |
          # Create deployment package with only necessary files
          tar -czf app.tar.gz \
            dist/ \
            package.json \
            package-lock.json \
            ecosystem.config.js \
            shared/
          
          # Verify package was created
          if [ ! -f "app.tar.gz" ]; then
            echo "❌ Failed to create deployment package"
            exit 1
          fi
          
          echo "✅ Package created successfully"
          ls -la app.tar.gz
          
          # Upload to VPS
          scp app.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.RELEASE_DIR }}/
          
          # Extract on VPS
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ env.RELEASE_DIR }}
            tar -xzf app.tar.gz
            rm app.tar.gz
            
            # Create necessary directories
            mkdir -p logs uploads certificates
            chmod 755 logs uploads certificates
          "

      - name: Install dependencies on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ env.RELEASE_DIR }}
            
            # Install production dependencies only
            npm ci --production --silent
            
            # Copy environment file if it exists
            if [ -f /opt/usa_notray/shared/.env ]; then
              cp /opt/usa_notray/shared/.env .env
            fi
            
            # Ensure PM2 is installed globally
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
          "

      - name: Deploy with PM2
        timeout-minutes: 5
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Update symlink
            ln -sfn ${{ env.RELEASE_DIR }} /opt/usa_notray/current
            
            # Stop existing PM2 process if running
            if pm2 describe ${{ env.APP_NAME }} > /dev/null 2>&1; then
              echo '🔄 Stopping existing PM2 process...'
              pm2 stop ${{ env.APP_NAME }}
              pm2 delete ${{ env.APP_NAME }}
            fi
            
            echo '🚀 Starting new PM2 process...'
            cd /opt/usa_notray/current
            
            # Verify ecosystem.config.js exists
            if [ ! -f 'ecosystem.config.js' ]; then
              echo '❌ ecosystem.config.js not found'
              ls -la
              exit 1
            fi
            
            # Verify dist/index.cjs exists
            if [ ! -f 'dist/index.cjs' ]; then
              echo '❌ dist/index.cjs not found'
              ls -la dist/
              exit 1
            fi
            
            # Start with production environment
            pm2 start ecosystem.config.js --env production
            
            # Save PM2 configuration
            pm2 save
            
            # Setup PM2 to start on system boot
            pm2 startup
            
            # Wait for app to start and check health
            echo '⏳ Waiting for application to start...'
            sleep 10
            
            # Check if app is running
            if pm2 describe ${{ env.APP_NAME }} > /dev/null 2>&1; then
              echo '✅ PM2 process started successfully'
              pm2 list
              
              # Show recent logs to verify startup
              echo '📝 Recent PM2 logs:'
              pm2 logs ${{ env.APP_NAME }} --lines 10 || echo 'No logs available'
            else
              echo '❌ PM2 process failed to start'
              echo '📋 PM2 error details:'
              pm2 logs || echo 'No PM2 logs available'
              pm2 list || echo 'PM2 list failed'
              exit 1
            fi
          "

      - name: Health check
        timeout-minutes: 3
        run: |
          echo "🔍 Performing health check..."
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Wait a bit more for app to fully initialize
            sleep 5
            
            # Check if app is responding
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo '✅ Health check passed'
            else
              echo '❌ Health check failed'
              echo 'PM2 Status:'
              pm2 list
              echo 'Recent logs:'
              pm2 logs ${{ env.APP_NAME }} --lines 20
              exit 1
            fi
          "

      - name: Cleanup old releases
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/usa_notray/releases
            # Keep only the 5 most recent releases
            ls -t | tail -n +6 | xargs -r rm -rf
          "

      - name: Deployment summary
        run: |
          echo "🎉 PM2 Deployment successful!"
          echo "🔗 Application URL: http://${{ secrets.VPS_HOST }}:3000"
          echo "📊 Release: ${{ env.RELEASE_DIR }}"
          echo "⚡ PM2 App: ${{ env.APP_NAME }}"
          echo "⏰ Deployment time: $(date)"
          echo "📝 PM2 Status:"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "pm2 list"
