name: Deploy to VPS

on:
  push:
    branches: [main, master, staging-9.2]
  workflow_dispatch:

env:
  NODE_VERSION: '20.19.4'
  APP_NAME: 'usa-notray'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate build compatibility
        run: |
          echo "🔍 Checking tool versions..."
          node --version
          npm --version
          npx esbuild --version
          npx tsc --version
          echo "✅ Tool versions validated"

      # Skip type check for now - build uses Vite/esbuild which are more permissive
      # - name: Type check
      #   run: npm run type-check

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build artifacts
        run: |
          if [ ! -f "dist/index.cjs" ]; then
            echo "❌ dist/index.cjs missing after build. Failing CI."
            echo "📁 Workspace root contents:" && ls -la | sed -n '1,200p'
            echo "📁 dist/ contents (if any):" && ls -la dist || true
            exit 1
          fi
          echo "✅ dist/index.cjs present. Proceeding to package."

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"

      - name: Create release directory
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "RELEASE_DIR=/opt/usa_notray/releases/$TIMESTAMP" >> $GITHUB_ENV
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/usa_notray/releases/$TIMESTAMP"

      - name: Upload application files
        run: |
          # Create deployment package with only necessary files
          tar -czf app.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='*.log' \
            --exclude='client/src' \
            --exclude='client/node_modules' \
            --exclude='uploads' \
            --exclude='certificates' \
            --exclude='logs' \
            dist/ \
            package.json \
            package-lock.json \
            ecosystem.config.cjs \
            drizzle.config.ts \
            migrations/ \
            scripts/ \
            shared/
          
          # Upload to VPS
          scp app.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.RELEASE_DIR }}/
          
          # Extract on VPS
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ env.RELEASE_DIR }}
            tar -xzf app.tar.gz
            rm app.tar.gz
          "

      - name: Install Node.js on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Install Node Version Manager (nvm) if not already installed
            if [ ! -d ~/.nvm ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            fi
            
            # Load nvm
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            
            # Install and use exact Node version
            nvm install ${{ env.NODE_VERSION }}
            nvm use ${{ env.NODE_VERSION }}
            nvm alias default ${{ env.NODE_VERSION }}
            
            # Verify versions
            echo \"Node version: \$(node --version)\"
            echo \"npm version: \$(npm --version)\"
          "

      - name: Install runtime dependencies on VPS (prod only)
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Load nvm
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            
            cd ${{ env.RELEASE_DIR }}
            
            # Ensure we're using the right Node version
            nvm use ${{ env.NODE_VERSION }}
            
            # Install with exact versions
            npm ci --silent --omit=dev
            
            # Copy environment file from shared directory
            cp /opt/usa_notray/.env .env
            
            # Update DATABASE_URL to use localhost on the server and ensure correct database name
            sed -i 's|@144\.202\.30\.172:|@localhost:|g' .env
            sed -i 's|/usa_notray\"|/usa_notray_production\"|g' .env
            sed -i 's|/usa_notray$|/usa_notray_production|g' .env
            
            # Enable static file serving
            echo 'SERVE_STATIC_FILES=true' >> .env
            
            echo \"📋 Updated DATABASE_URL:\"
            grep DATABASE_URL .env || echo \"No DATABASE_URL found in .env\"
            
            # Fix client files path structure if nested
            if [ -d \"dist/public/dist\" ] && [ ! -f \"dist/public/index.html\" ]; then
              echo \"📂 Fixing nested client files structure...\"
              mv dist/public/dist/* dist/public/ 2>/dev/null || true
              rmdir dist/public/dist 2>/dev/null || true
              echo \"✅ Client files structure fixed\"
            fi
            
            # Create client/dist symlink pointing to dist/public for server compatibility
            if [ -d \"dist/public\" ] && [ ! -d \"client/dist\" ]; then
              echo \"📂 Creating client/dist symlink for server compatibility...\"
              mkdir -p client
              ln -sf ../dist/public client/dist
              echo \"✅ client/dist -> dist/public symlink created\"
            fi
            
            # Create necessary directories
            mkdir -p uploads certificates logs
            chmod 755 uploads certificates logs
          "

      - name: Fix database permissions
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Fix database table ownership to prevent permission errors
            sudo -u postgres psql -d usa_notray_production -c \"
              ALTER TABLE IF EXISTS certificates OWNER TO usa_notray_user;
              ALTER TABLE IF EXISTS certificate_storage OWNER TO usa_notray_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO usa_notray_user;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO usa_notray_user;
            \" || echo 'Database permission fix attempted'
          "

      - name: Deploy with PM2
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Load nvm
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            
            # Ensure PM2 is installed globally for this Node version
            nvm use ${{ env.NODE_VERSION }}
            npm install -g pm2
            
            # Update symlink to new release
            ln -sfn ${{ env.RELEASE_DIR }} /opt/usa_notray/current
            
            echo '🔗 Symlink now points to:'
            ls -l /opt/usa_notray/current || true
            readlink -f /opt/usa_notray/current || true
            
            echo '📁 Contents of current release:'
            ls -la ${{ env.RELEASE_DIR }} | sed -n '1,200p'

            # Process cleanup removed to prevent exit code 255 errors
            echo '🧹 Proceeding with PM2 deployment...'
            
            # Ensure PM2 uses the fresh symlink target
            if pm2 describe ${{ env.APP_NAME }} > /dev/null 2>&1; then
              echo '🧹 Deleting existing PM2 process to refresh cwd/script path...'
              pm2 delete ${{ env.APP_NAME }} || true
            fi

            echo '🚀 Starting PM2 with latest release (update env + cwd)'
            cd /opt/usa_notray/current
            echo '🔍 Verifying build artifacts shipped from CI...'
            if [ ! -f "dist/index.cjs" ]; then
              echo '❌ dist/index.cjs is missing in the release package. The CI build must produce dist/ before upload.'
              ls -la | sed -n '1,200p'
              exit 1
            fi
            echo '✅ dist/index.cjs found.'
            if [ -f "/opt/usa_notray/current/ecosystem.config.cjs" ]; then
              echo '🧩 Found ecosystem.config.cjs, starting via ecosystem file'
              pm2 start /opt/usa_notray/current/ecosystem.config.cjs --update-env
            else
              echo '⚠️ ecosystem.config.cjs not found, starting app from dist/index.cjs as fallback'
              if [ -f "dist/index.cjs" ]; then
                pm2 start dist/index.cjs --name ${{ env.APP_NAME }} --update-env
              else
                echo '❌ dist/index.cjs not found in current release directory'
                ls -la
                exit 1
              fi
            fi

            # Save PM2 configuration
            pm2 save

            # Wait for app to start with timeout
            echo '⏳ Waiting for application to start...'
            TIMEOUT=30
            COUNTER=0
            while [ \$COUNTER -lt \$TIMEOUT ]; do
              if pm2 describe ${{ env.APP_NAME }} | grep -q 'online' 2>/dev/null; then
                echo '✅ Application is online!'
                break
              fi
              if pm2 describe ${{ env.APP_NAME }} | grep -q 'errored\|stopped' 2>/dev/null; then
                echo '❌ Application failed to start'
                pm2 logs ${{ env.APP_NAME }} --lines 20
                exit 1
              fi
              sleep 1
              COUNTER=\$((COUNTER + 1))
              echo \"Waiting... (\$COUNTER/\$TIMEOUT)\"
            done

            if [ \$COUNTER -eq \$TIMEOUT ]; then
              echo '❌ Application startup timeout'
              pm2 logs ${{ env.APP_NAME }} --lines 20
              exit 1
            fi

            echo 'ℹ️ Final PM2 status:'
            pm2 status
            
            # Verify port is listening
            if netstat -tlnp | grep -q ':3000.*LISTEN'; then
              echo '✅ Application is listening on port 3000'
            else
              echo '⚠️ Application may not be listening on port 3000'
              netstat -tlnp | grep :3000 || echo 'No process on port 3000'
            fi
          "

      - name: Cleanup old releases
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/usa_notray/releases
            # Keep only the 5 most recent releases
            ls -t | tail -n +6 | xargs -r rm -rf
          "

      - name: Health check
        run: |
          echo "🔍 Performing health check..."
          sleep 5
          curl -f https://sharpnote.net/health || echo "Health check failed, but deployment completed"

      - name: Static path verification
        run: |
          echo "🔎 Verifying static files path served by app..."
          # This endpoint is implemented in server/vite.ts
          curl -s https://sharpnote.net/static-health | sed -n '1,200p' || echo "static-health endpoint not available"

      - name: Deployment summary
        run: |
          echo "🎉 Deployment successful!"
          echo "🔗 Application URL: https://sharpnote.net"
          echo "📊 Release: ${{ env.RELEASE_DIR }}"
          echo "⚡ PM2 App: ${{ env.APP_NAME }}"
          echo "⏰ Deployment time: $(date)"
